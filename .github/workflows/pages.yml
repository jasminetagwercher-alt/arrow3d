name: Publish VECTOR to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Re-publish after validation; wait for any legacy branch publication first.
  workflow_run:
    workflows: ["Validate VECTOR"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for legacy Pages publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 24); do
            pending="$(gh api "repos/$REPOSITORY/actions/runs?head_sha=$DEPLOY_SHA&per_page=100" --jq '[.workflow_runs[] | select(.name == "pages build and deployment" and .status != "completed")] | length')"
            if [ "$pending" = "0" ]; then exit 0; fi
            sleep 5
          done
          echo "Legacy Pages publication has not finished; retry this workflow."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish game
        id: deployment
        uses: actions/deploy-pages@v4
